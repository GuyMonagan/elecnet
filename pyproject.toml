[project]
name = "elecnet"
version = "0.1.0"
description = ""
authors = [
    {name = "GuyMonagan", email = "werevalkury@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"  # Оставляем как было
dependencies = [
    "django>=5.1,<6.0",           # Ограничиваем версию Django сверху
    "djangorestframework (>=3.16.1,<4.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-filter (>=25.2,<26.0)",
    "drf-yasg (>=1.21.14,<2.0.0)"
]

[tool.poetry]
package-mode = false             # Говорим Poetry, что это не пакет (замена --no-root)

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-django (>=4.11.1,<5.0.0)",
    "coverage (>=7.13.4,<8.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
